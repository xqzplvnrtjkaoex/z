[workspace]
resolver = "3"
members = [
    "crates/madome-proto",
    "crates/madome-core",
    "crates/madome-common",
    "services/gateway",
    "services/auth",
    "services/catalog",
    "services/user",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "signal"] }

# REST framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# gRPC
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# gRPC build
tonic-prost-build = "0.14"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utilities
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# ORM
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }

# Validation
validator = { version = "0.20", features = ["derive"] }
regex = "1"

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# Async traits
trait-variant = "0.1"
async-trait = "0.1"

# Testing
mockall = "0.14"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

# Internal crates
madome-proto = { path = "crates/madome-proto" }
madome-core = { path = "crates/madome-core" }
madome-common = { path = "crates/madome-common" }
