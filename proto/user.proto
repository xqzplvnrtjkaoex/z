syntax = "proto3";
package madome.user;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service UserService {
  rpc Health(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc GetUserByHandle(GetUserByHandleRequest) returns (UserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc DeactivateUser(DeactivateUserRequest) returns (UserResponse);
  rpc ActivateUser(ActivateUserRequest) returns (UserResponse);
  rpc ChangeRole(ChangeRoleRequest) returns (UserResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ADMIN = 2;
  ROLE_OWNER = 3;
}

message UserResponse {
  string id = 1;
  string handle = 2;
  string name = 3;
  Role role = 4;
  bool is_active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CreateUserRequest {
  string handle = 1;
  string name = 2;
  Role role = 3;
}

message GetUserRequest {
  string id = 1;
}

message GetUserByHandleRequest {
  string handle = 1;
}

message ListUsersRequest {
  int32 limit = 1;
  optional string cursor = 2;
  bool include_inactive = 3;
}

message ListUsersResponse {
  repeated UserResponse users = 1;
  optional string next_cursor = 2;
}

message UpdateUserRequest {
  string id = 1;
  optional string handle = 2;
  optional string name = 3;
}

message DeactivateUserRequest {
  string id = 1;
}

message ActivateUserRequest {
  string id = 1;
}

message ChangeRoleRequest {
  string id = 1;
  Role new_role = 2;
}
